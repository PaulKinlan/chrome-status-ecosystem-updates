name: Weekly Chrome Ecosystem Report & Deploy

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Chrome Milestone(s) (e.g. "last-5", "150-154", "154", or "auto")'
        required: false
        default: 'last-5'
      limit:
        description: 'Max features to process (optional, defaults to MAX_FEATURES below)'
        required: false
        default: ''
      skip_crawl:
        description: 'Skip crawling and just deploy existing reports'
        type: boolean
        required: false
        default: false
      force:
        description: 'Publish even if a safety check refuses (ChromeStatus returned no or far fewer features, or most features failed)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - 'reports/**'
      - '.github/workflows/weekly-report.yml'
  pull_request:
    branches:
      - main

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: 'weekly-ecosystem-report'
  # A crawl can run for the best part of an hour and ends in a commit+push.
  # Cancelling mid-flight risks tearing between `git commit` and `git push`.
  cancel-in-progress: false

env:
  # Hard ceiling for unattended runs. `last-5` can resolve to hundreds of
  # features, each costing ~6 LLM calls, so scheduled runs are capped.
  SCHEDULED_MAX_FEATURES: '150'

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Lower bound must match `engines.node` in package.json.
        node-version: ['22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # No lockfile and no runtime dependencies, so there is nothing to install.
      - name: Run tests
        run: npm test

  # The crawl is the one job that holds the API keys and reads untrusted web pages, so it can read the repository
  # and nothing more: its token cannot push, and none is left in .git/config. `publish` below is the job that
  # writes, and it never runs the crawler or sees a secret.
  crawl:
    name: Crawl & build reports
    needs: test
    # Nothing to crawl for a pull request, for a push, or for a manual run that asked to skip it; `publish` then
    # deploys what is already committed.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_crawl)
    runs-on: ubuntu-latest
    # The crawl is network-bound and unattended; never let it burn the 6h default.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run Ecosystem Intelligence Crawler
        timeout-minutes: 50
        env:
          TARGET_MILESTONES: ${{ inputs.milestone || 'last-5' }}
          MAX_FEATURES: ${{ inputs.limit || env.SCHEDULED_MAX_FEATURES }}
          # After this many minutes no feature (and no step of one) is started, and the report is published with
          # what the crawl has; the step timeout above is what kills it, and a killed crawl publishes nothing.
          CRAWL_DEADLINE_MINUTES: '40'
          # Empty (off) for scheduled runs; see the quality gate in src/quality.js.
          FORCE_REPORT: ${{ inputs.force && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          # The same token under its other name (src/config.js reads either): a repository secret of either name works.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node bin/cli.js run

      # What the crawl hands on: the two directories it writes, and nothing else. Only after a successful crawl;
      # a crawl that failed or refused to publish hands nothing on, and so nothing is committed or deployed.
      - name: Hand over reports and data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crawl-output
          path: |
            reports/
            data/
          if-no-files-found: error
          # A re-run of the whole workflow uploads again under the same name.
          overwrite: true
          # Long enough to look at what `publish` was given if it fails, and no longer: it is 80 MB of files.
          retention-days: 3

  # Commits and deploys. It runs for a successful crawl, and for a run with no crawl (a push, or a manual run that
  # skipped it), which publishes what is already committed. A crawl that failed or refused leaves it, and the
  # deployment, skipped. `!cancelled()` is what lets it run when `crawl` was skipped.
  publish:
    name: Commit & publish reports
    needs: [test, crawl]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.crawl.result == 'success' || needs.crawl.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job pushes, so unlike the crawl's its checkout keeps the token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the crawl's reports and data
        if: needs.crawl.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crawl-output
          path: crawl-output

      # Replaced, not overlaid: a file the crawl removed (an old history archive) must go here too. What the crawl
      # hands over is the one thing this job takes from the job that reads untrusted pages, and the job that writes
      # trusts it, so it is looked at first and nothing is deleted if it is not what a finished crawl leaves: the two
      # files that every crawl writes, and no symbolic link.
      - name: Replace reports and data with the crawl's
        if: needs.crawl.result == 'success'
        run: |
          set -euo pipefail
          for required in crawl-output/reports/latest.json crawl-output/data/history.json; do
            if [ ! -s "$required" ]; then
              echo "::error::The crawl's output has no $required, or it is empty; refusing to publish it."
              exit 1
            fi
          done
          if [ -n "$(find crawl-output -type l)" ]; then
            echo "::error::The crawl's output holds a symbolic link; refusing to publish it."
            exit 1
          fi
          rm -rf reports data
          mv crawl-output/reports reports
          mv crawl-output/data data
          rm -rf crawl-output

      # The snapshot, not the whole report: reports/README.md is up to a megabyte
      # and a job summary may not exceed 1 MiB (it is cut off, or rejected).
      - name: Publish to Job Summary
        if: success() && hashFiles('reports/summary.md') != ''
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure .nojekyll exists
        run: mkdir -p reports && touch reports/.nojekyll

      # Uploaded BEFORE the commit step so that a push failure (e.g. a race with
      # another commit to main) still produces a deployable artifact.
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'reports/'

      - name: Commit and push reports & data history
        if: needs.crawl.result == 'success'
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # %G (ISO week-numbering year) must pair with %V (ISO week), otherwise
          # the ID disagrees with getIsoWeekString() around New Year.
          WEEK_ID=$(date +'%G-W%V')
          # NOTE: `[skip ci]` plus the fact that pushes made with the default
          # GITHUB_TOKEN do not trigger workflows is what stops the
          # `push: paths: reports/**` trigger from looping. If this is ever
          # switched to a PAT or deploy key, that safeguard disappears.
          git commit -m "chore(report): automated ecosystem update for $WEEK_ID [skip ci]"
          # The crawl can take ~an hour, so main may have moved underneath us.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto origin/main and retrying..."
            git pull --rebase --autostash origin main
          done
          echo "::error::Failed to push reports after 3 attempts."
          exit 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: publish
    # Without a status function (`!cancelled()` is one) GitHub skips this job whenever any job up its chain was
    # skipped, although `publish` itself ran: on a push, or a manual run that skipped the crawl, `crawl` is skipped, so
    # nothing would ever be deployed. What the deployment needs of `publish` is therefore written out: failing tests,
    # a crawl that failed or refused, and a publication that lost a race all leave it skipped.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # GitHub recommends never cancelling an in-progress Pages deployment.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
